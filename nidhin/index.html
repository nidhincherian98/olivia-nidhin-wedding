<script id="nidhin-wording">
// Personal wording for Nidhin's invitation only.
document.addEventListener('DOMContentLoaded', () => {
  const family = window.INVITATION.families.nidhin;
  Object.assign(family, {
    parents: 'VERY REV. K.V. CHERIAN AND MRS. SUSAN V THOMAS',
    relation: 'D/O MR. SHAJI KANANTHEKATTIL BABY AND MRS. LINY SHAJI',
    relationHome: '(JOBY VILLA, PANDANAD, CHENGANNUR)',
    compliments: 'Nissy & Mark'
  });
  window.INVITATION.venue = 'St. Thomas Mar Thoma Church (SCS)';
  document.querySelectorAll('[data-family]').forEach(el => {
    el.textContent = family[el.dataset.family] || '';
  });
  document.querySelector('[data-text="venue"]').textContent = window.INVITATION.venue;
});
</script>
